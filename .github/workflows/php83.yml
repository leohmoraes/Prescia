name: PHP 8.3 compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Run compatibility tests
        run: composer test

      - name: Lint tracked PHP files
        run: git ls-files '*.php' -z | xargs -0 -n1 php -l

      - name: Run PHPStan
        run: composer analyse

      - name: Build Docker image
        run: docker build --tag prescia:php83 .

      - name: Scan Docker image
        # v0.35.0; pin immutable commit after the 2026 supply-chain incident.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: prescia:php83
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
